[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "droidforensix"
version = "0.1.0"
description = "Offline Android malware analysis and unpacking"
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Source = "https://github.com/DarshakPatel2004/project-zero"

[project.scripts]
droidforensix = "droidforensix.cli:main"

[tool.ruff]
# Research and one-off tooling is excluded: its star imports and dead code are known.
extend-exclude = ["analysis/emulate", "kali result"]

[tool.ruff.lint]
# pyflakes (undefined names, unused imports and variables), bugbear (real bug patterns), isort.
select = ["F", "B", "I"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameter defaults with these calls; that is the framework's idiom.
extend-immutable-calls = ["fastapi.Query", "fastapi.File", "fastapi.Depends", "fastapi.Form"]

[tool.setuptools]
packages = ["analysis", "backend", "backend.core", "droidforensix"]
py-modules = [
    "stage3_replay",
    "droidforensix_llm",
    "ioc_scanner",
    "batch_classify",
    "classify_malware_batch",
    "classify_all_legitimate",
    "metrics_summary",
    "decompile_java",
    "brute_replay",
]